<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism — Business Intelligence Dashboard</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpolygon points='14,3 27,24 1,24' fill='none' stroke='%23c9a84c' stroke-width='2'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <!-- Loaded last so its overrides win -->
  <link rel="stylesheet" href="assets/css/responsive.css" />

  <!--
    Chart.js is vendored, not CDN-loaded: a CDN outage would blank both charts,
    and a third-party script tag on a page showing client financials is a
    supply-chain exposure. Pinned to 4.5.0 — see docs/DEPLOYMENT.md.
  -->
  <script src="assets/vendor/chart.umd.js"></script>
</head>
<body>

<a class="skip-link" href="#view">Skip to main content</a>

<div class="shell" id="shell">

  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <!-- =====================================================================
       SIDEBAR — structure only; nav items are built by src/app.js
       ===================================================================== -->
  <aside class="sidebar">

    <a href="#/overview" class="sidebar-logo">
      <!-- Prism geometric logo mark: triangle prism shape -->
      <svg class="prism-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="14,3 27,24 1,24" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linejoin="round"/>
        <line x1="14" y1="3" x2="14" y2="24" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5"/>
        <line x1="14" y1="14" x2="27" y2="24" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.35"/>
        <polygon points="14,14 27,24 1,24" fill="#c9a84c" fill-opacity="0.08"/>
      </svg>
      <div>
        <div class="sidebar-logo-text"><span id="brand-name">Prism</span><span>by Wohlf Solutions</span></div>
      </div>
    </a>

    <nav class="sidebar-nav" aria-label="Main">
      <div class="nav-section-label" id="label-workspace">Workspace</div>
      <div id="nav-workspace" role="group" aria-labelledby="label-workspace"></div>

      <div class="nav-section-label" style="margin-top:6px" id="label-modules">Modules</div>
      <div id="nav-modules" role="group" aria-labelledby="label-modules"></div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-label">Signed in as</div>
        <div class="sidebar-user-name" id="user-name"></div>
        <div class="sidebar-user-email" id="user-email"></div>
      </div>

      <a href="#/settings" class="nav-item" data-route="#/settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5"/>
          <circle cx="8" cy="6" r="2.5"/>
          <path d="M2.5 13.5 C3 10.5 5 9 8 9 C11 9 13 10.5 13.5 13.5"/>
        </svg>
        Settings
      </a>
    </div>
  </aside>

  <!-- =====================================================================
       MAIN
       ===================================================================== -->
  <div class="main">

    <header class="topbar">
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle" type="button"
                aria-expanded="false" aria-label="Toggle navigation">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
          </svg>
        </button>
        <div>
          <div class="topbar-title" id="topbar-title">Prism</div>
          <div class="topbar-subtitle" id="topbar-subtitle"></div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="refresh" type="button">Refresh</button>
        <a class="btn btn-primary" href="#/reports">New report</a>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1"></main>

    <div style="text-align:center;padding:12px 0 4px;color:var(--text-dim);font-size:11px">
      Prism by Wohlf Solutions · v0.3
    </div>
  </div>
</div>

<script type="module" src="src/app.js"></script>

</body>
</html>
